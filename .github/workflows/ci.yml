name: CI

on:
  pull_request:
    branches:
      - "*"
  push:
    branches:
      - main

jobs:
  stylua:
    name: stylua
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: JohnnyMorganz/stylua-action@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: latest
          args: --check .config/nvim

  emmylua_check:
    needs: stylua
    name: emmylua_check
    runs-on: ubuntu-latest
    steps:
      - name: Setup neovim
        shell: bash
        run: |
          set -euo pipefail
          dest="$HOME/nvim-stable"
          curl -fsSL "https://github.com/neovim/neovim/releases/download/stable/nvim-linux-x86_64.tar.gz" -o /tmp/nvim.tar.gz
          mkdir -p "$dest"
          tar -xzf /tmp/nvim.tar.gz -C "$dest" --strip-components=1
          echo "$dest/bin" >> "$GITHUB_PATH"
          echo "VIMRUNTIME=$("$dest/bin/nvim" --clean --headless -c 'lua io.write(vim.env.VIMRUNTIME or (vim.fn.fnamemodify(vim.v.progpath, ":h:h") .. "/share/nvim/runtime"))' -c 'quit')" >> "$GITHUB_ENV"

      - uses: actions/checkout@v7

      - name: Install EmmyLua Check
        shell: bash
        run: |
          set -euo pipefail
          EMMYLUA_VERSION="0.25.1"
          INSTALL_DIR="$HOME/.local/bin/emmylua"
          mkdir -p "$INSTALL_DIR"
          URL="https://github.com/EmmyLuaLs/emmylua-analyzer-rust/releases/download/${EMMYLUA_VERSION}/emmylua_check-linux-x64.tar.gz"
          curl -fsSL "$URL" | tar -xzC "$INSTALL_DIR"
          chmod +x "$INSTALL_DIR/emmylua_check"
          echo "$INSTALL_DIR" >> "$GITHUB_PATH"

      - name: Checkout locked Neovim plugins for analysis
        shell: bash
        run: |
          set -euo pipefail
          plugins_dir="$RUNNER_TEMP/emmylua-plugins"
          mkdir -p "$plugins_dir"

          while IFS=$'\t' read -r src rev; do
            name="${src##*/}"
            name="${name%.git}"
            git clone --quiet --filter=blob:none --no-checkout "$src" "$plugins_dir/$name"
            git -C "$plugins_dir/$name" checkout --quiet "$rev"
          done < <(jq -r '.plugins[] | [.src, .rev] | @tsv' .config/nvim/nvim-pack-lock.json)

      - name: Run emmylua_check
        shell: bash
        run: |
          set -euo pipefail
          plugins_dir="$RUNNER_TEMP/emmylua-plugins"
          plugin_lua_paths=()
          require_patterns=()

          while IFS= read -r lua_dir; do
            plugin_lua_paths+=("$lua_dir")
            require_patterns+=("$lua_dir/?.lua" "$lua_dir/?/init.lua")
          done < <(find "$plugins_dir" -mindepth 2 -maxdepth 2 -type d -name lua -print)

          plugin_lua_json="$(printf '%s\n' "${plugin_lua_paths[@]}" | jq -R . | jq -s .)"
          require_patterns_json="$(printf '%s\n' "${require_patterns[@]}" | jq -R . | jq -s .)"

          jq --arg runtime "$VIMRUNTIME" \
            --argjson plugins "$plugin_lua_json" \
            --argjson patterns "$require_patterns_json" \
            '(.workspace.library |= map(select(. != "$VIMRUNTIME"))) |
             .workspace.library += [$runtime, ($runtime + "/lua/vim/_meta/vimfn.gen.lua")] + $plugins |
             .runtime.requirePattern = (($patterns // []) + ["?.lua", "?/init.lua", "lua/?.lua", "lua/?/init.lua"])' \
            .emmyrc.json > "$RUNNER_TEMP/.emmyrc.json"

          probe="$RUNNER_TEMP/vimfn-probe.lua"
          printf '%s\n' 'vim.fn.fnamemodify({}, ":p")' > "$probe"
          if emmylua_check "$probe" --config "$RUNNER_TEMP/.emmyrc.json" > "$RUNNER_TEMP/vimfn-probe.log" 2>&1; then
            echo "Expected EmmyLua to reject an invalid vim.fn.fnamemodify argument, but it did not."
            cat "$RUNNER_TEMP/vimfn-probe.log"
            exit 1
          fi
          if ! grep -Eq 'param-type-mismatch|call-arg-mismatch|argument-type-mismatch' "$RUNNER_TEMP/vimfn-probe.log"; then
            echo "The Neovim vim.fn metadata probe failed for an unexpected reason:"
            cat "$RUNNER_TEMP/vimfn-probe.log"
            exit 1
          fi

          emmylua_check --warnings-as-errors .config/nvim/lua --config "$RUNNER_TEMP/.emmyrc.json"
