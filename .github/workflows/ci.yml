name: CI

on:
  pull_request:
    branches:
      - "*"
  push:
    branches:
      - main

jobs:
  stylua:
    name: stylua
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: JohnnyMorganz/stylua-action@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: latest
          args: --check .config/nvim

  emmylua_check:
    needs: stylua
    name: emmylua_check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup neovim
        shell: bash
        run: |
          set -euo pipefail
          dest="$HOME/nvim-stable"
          curl -fsSL "https://github.com/neovim/neovim/releases/download/stable/nvim-linux-x86_64.tar.gz" -o /tmp/nvim.tar.gz
          mkdir -p "$dest"
          tar -xzf /tmp/nvim.tar.gz -C "$dest" --strip-components=1
          echo "$dest/bin" >> "$GITHUB_PATH"

      - name: Install plugins
        shell: bash
        env:
          XDG_CONFIG_HOME: ${{ github.workspace }}/.config
        run: |
          set -euo pipefail
          export XDG_DATA_HOME="$HOME/.local/share"
          nvim --headless -u NONE "+lua vim.pack.update(nil, { target = 'lockfile' })" +qa

      - name: Install emmylua_check
        shell: bash
        run: |
          set -euo pipefail
          EMMYLUA_VERSION="0.25.1"
          INSTALL_DIR="$HOME/.local/bin/emmylua"
          mkdir -p "$INSTALL_DIR"
          URL="https://github.com/EmmyLuaLs/emmylua-analyzer-rust/releases/download/${EMMYLUA_VERSION}/emmylua_check-linux-x64.tar.gz"
          curl -fsSL "$URL" | tar -xzC "$INSTALL_DIR"
          chmod +x "$INSTALL_DIR/emmylua_check"
          echo "$INSTALL_DIR" >> "$GITHUB_PATH"

      - name: Run emmylua_check
        shell: bash
        run: |
          set -euo pipefail
          export VIMRUNTIME="$(nvim --clean --headless -c 'lua io.write(vim.env.VIMRUNTIME)' -c 'quit')"
          emmylua_check --warnings-as-errors .config/nvim/lua --config ./.emmyrc.json
